services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ainovel
      POSTGRES_PASSWORD: ainovel
      POSTGRES_DB: ainovel
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ainovel']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for novel covers and import files. The S3 API (8333) needs the S3_* keys;
  # the filer (8888) serves stored files over plain HTTP and is what S3_PUBLIC_BASE_URL points at.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ainovel
      S3_SECRET_ACCESS_KEY: ainovel-dev-secret
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"ainovel","credentials":[{"accessKey":"$${S3_ACCESS_KEY_ID}","secretKey":"$${S3_SECRET_ACCESS_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3 -s3.config=/tmp/s3.json -volume.max=0
    ports:
      - '8333:8333'
      - '8888:8888'
    volumes:
      - seaweeddata:/data

volumes:
  pgdata:
  seaweeddata:
