services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ainovel
      POSTGRES_PASSWORD: ainovel
      POSTGRES_DB: ainovel
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ainovel']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for novel covers/imports (console: http://localhost:9001).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ainovel
      MINIO_ROOT_PASSWORD: ainovel-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  # Creates the bucket with anonymous read so S3_PUBLIC_BASE_URL serves covers directly.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ainovel ainovel-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/ainovel;
      mc anonymous set download local/ainovel/covers;
      "

volumes:
  pgdata:
  miniodata:
