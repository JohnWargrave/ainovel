# Fixed project name: container/volume/network names stay be-ainovel-* whatever directory this is
# deployed from, so it can never collide with another stack on the same host.
name: be-ainovel

x-backend-env: &backend-env
  env_file:
    - .env.production
  environment:
    NODE_ENV: production
    PORT: ${PORT:-3000}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible storage for novel covers and import files. The S3 API (8333) needs the S3_* keys;
  # the filer (8888) serves stored files over plain HTTP and is what S3_PUBLIC_BASE_URL points at.
  # 1GB volumes with a fixed cap: the 30GB default leaves a small disk only ~2 volume slots, all
  # taken at boot, and every bucket write then fails with "no free volumes left".
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # Signs with SEAWEEDFS_ACCESS_KEY_ID / SEAWEEDFS_SECRET_ACCESS_KEY, falling back to the API's
    # S3_* keys. Set the SEAWEEDFS_* pair to the old keys before pointing S3_* at Cloudflare R2, or
    # this store would come back up with the R2 keys and the move off it could no longer read it.
    env_file:
      - .env.production
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities":[{"name":"ainovel","credentials":[{"accessKey":"$${SEAWEEDFS_ACCESS_KEY_ID:-$${S3_ACCESS_KEY_ID}}","secretKey":"$${SEAWEEDFS_SECRET_ACCESS_KEY:-$${S3_SECRET_ACCESS_KEY}}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 -volume.max=50
    ports:
      # Filer only, loopback only: host nginx serves /media/covers/ from it. The S3 API stays internal.
      - '127.0.0.1:${FILER_PORT:-8888}:8888'
    volumes:
      - seaweeddata_prod:/data

  migrate:
    <<: *backend-env
    restart: 'no'
    build:
      <<: *backend-build
      target: api
    image: be-ainovel-migrate:latest
    command:
      [
        'node',
        'node_modules/node-pg-migrate/bin/node-pg-migrate.js',
        'up',
        '--migrations-dir',
        'src/db/migrations',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  backend-api:
    <<: *backend-env
    restart: unless-stopped
    build:
      <<: *backend-build
      target: api
    image: be-ainovel-api:latest
    ports:
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3000}:${PORT:-3000}'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "Promise.all(['/health', '/cms'].map((path) => fetch('http://127.0.0.1:' + (process.env.PORT ?? '3000') + path))).then((responses) => { if (responses.some((r) => !r.ok)) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend-worker:
    <<: *backend-env
    restart: unless-stopped
    build:
      <<: *backend-build
      target: worker
    image: be-ainovel-worker:latest
    command: ['node', 'dist/worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata_prod:
  redisdata_prod:
  seaweeddata_prod:
